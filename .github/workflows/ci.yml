name: Cargo Build & Test

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: test
    strategy:
      matrix:
        toolchain:
          - stable
          - beta
          - nightly
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      NEXTEST_PROFILE: ${{ matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable' && 'ci' || 'default' }}

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --check
      - run: cargo build --verbose --no-default-features
      - run: cargo clippy -- -D clippy::all
      - run: cargo nextest run --verbose --no-default-features
      - run: cargo clean
      - run: cargo build --verbose
      - if: ${{ matrix.os == 'windows-latest' }}
        uses: ssciwr/setup-mesa-dist-win@v2
      - if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: ./.github/actions/linux-deps
      - uses: coactions/setup-xvfb@v1
        with:
          run: cargo nextest run --verbose
      - name: Upload test results to Codecov
        if: ${{ env.NEXTEST_PROFILE == 'ci' && !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/nextest/ci/junit.xml

  web:
    name: build wasm
    # The wasm build is target-only (no testable runtime), so the job just
    # verifies it compiles: a broken web-only path (e.g. a `cfg(wasm)`
    # branch) would otherwise only surface locally.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
      - uses: taiki-e/install-action@wasm-pack
      - run: wasm-pack build --target web --out-dir pkg --dev

  bench:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo build --release --verbose
      - if: ${{ matrix.os == 'windows-latest' }}
        uses: ssciwr/setup-mesa-dist-win@v2
      - if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: ./.github/actions/linux-deps
      - uses: coactions/setup-xvfb@v1
        with:
          run: cargo bench --verbose --features unstable

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      - uses: ./.github/actions/linux-deps
      - uses: coactions/setup-xvfb@v1
        with:
          # Nightly + `unstable`: the report includes the SIMD backend and the
          # `benchmarks`/`simd` modules, and the `unstable`-gated
          # `#[coverage(off)]` attributes that exclude unreachable self-test
          # failure branches.
          run: cargo llvm-cov nextest --features unstable --codecov --output-path codecov.json
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: codecov.json
          fail_ci_if_error: true
