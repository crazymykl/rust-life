<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Life</title>
    <style>
      body { margin: 0; background: #222; }

      /* The container the canvas is sized to; drag its bottom-right grip to
         resize. `overflow: hidden` is required for `resize` to take effect
         and also clips the board when the container is smaller than the
         board (like a native window resize). No border/padding/transform
         here or on the canvas: winit can't account for them in its
         geometry math. */
      #app {
        position: relative;
        width: 512px;
        height: 512px;
        max-width: 100vw;
        max-height: 100vh;
        resize: both;
        overflow: hidden;
      }

      /* The canvas fills the container. The `!important` is required: winit
         writes the canvas size as an *inline* style (px) at creation and on
         DPI changes, and inline styles beat stylesheet rules, so without it
         the canvas would stay pinned to winit's size. winit's ResizeObserver
         reads the canvas's *CSS* size, so this CSS resize propagates into
         the GPU surface (and the board pads to match). */
      canvas {
        display: block;
        image-rendering: pixelated;
        width: 100% !important;
        height: 100% !important;
      }

      /* A quiet legend pinned to the container's top-right. `pointer-events:
         none` so it never intercepts the canvas clicks/keys it documents. */
      #controls {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 1;
        margin: 0;
        padding: 10px 12px;
        font: 12px/1.7 system-ui, sans-serif;
        color: #e8e8e8;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        pointer-events: none;
        user-select: none;
      }
      #controls dt { float: left; margin-right: 8px; color: #9a9a9a; }
      #controls dd { margin: 0; clear: left; }
      kbd {
        background-color: #f7f7f7;
        border: 1px solid #ccc;
        border-radius: 3px;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.2), 0 0 0 2px #fff inset;
        display: inline-block;
        font-family: monospace;
        font-size: 0.85em;
        padding: 0.1em 0.4em;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <dl id="controls">
        <dt>Left click</dt><dd>toggle a cell</dd>
        <dt>Right click</dt><dd>pause / resume</dd>
        <dt><kbd>Space</kbd></dt><dd>pause / resume</dd>
        <dt><kbd>S</kbd></dt><dd>step one generation</dd>
        <dt><kbd>C</kbd></dt><dd>clear the board</dd>
        <dt><kbd>R</kbd></dt><dd>randomize</dd>
      </dl>
    </div>
    <script type="module">
      // The default export is the async `init()`. Loading the module instantiates
      // the wasm, and the `#[wasm_bindgen(start)]` hook in `rust_life` then
      // launches the GUI automatically.
      const init = await import('../pkg/rust_life.js');
      await init.default();
      // winit appends the canvas to <body> — usually synchronously during the
      // init above, but later (e.g. while waiting on a GPU permission) if the
      // loop starts delayed — so move it into the container if it's there
      // now, and watch for it if it isn't.
      const app = document.getElementById('app');
      const moveCanvas = () =>
        document.querySelectorAll('body > canvas').forEach((c) => app.append(c));
      moveCanvas();
      new MutationObserver(moveCanvas).observe(document.body, { childList: true });
    </script>
  </body>
</html>
